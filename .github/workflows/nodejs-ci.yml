name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]
        # Evaluaremos en las versiones estables de Node.js

    steps:
    - name: 📥 Clonar el repositorio
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 📦 Instalar dependencias
      run: npm install

    # 🚧 Descomenta las siguientes líneas cuando configures scripts en tu package.json
    
