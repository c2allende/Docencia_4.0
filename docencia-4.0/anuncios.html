<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Centro de noticias y anuncios importantes para los participantes de Docencia 4.0. Mantente al día con las últimas actualizaciones del programa.">
    <title>Anuncios | Docencia 4.0</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">

    <style>
        body {
            margin: 0;
            padding-top: var(--height-module-topnav, 80px);
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--color-background-page);
            color: var(--color-text-primary);
            font-family: var(--font-family-body);
            line-height: var(--line-height-loose);
        }

        .announcements-wrapper {
            max-width: 1120px;
            margin: var(--spacing-xl) auto var(--spacing-16);
            padding: 0 var(--spacing-md);
        }

        .announcements-shell {
            position: relative;
            overflow: hidden;
            padding: var(--spacing-16);
            background: var(--color-background-surface);
            border: var(--border-width-1) solid var(--color-border-default);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-ambient);
        }

        .announcements-header {
            margin-bottom: var(--spacing-xl);
        }

        .announcements-title {
            margin: 0;
            color: var(--color-text-display);
            font-family: var(--font-family-heading);
            font-size: var(--font-size-4xl);
            font-weight: var(--font-weight-extrabold);
        }

        .announcements-title span {
            color: var(--color-brand-primary);
        }

        /* --- Estilos de Pestañas/Filtros --- */
        .announcements-tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-md);
            border-bottom: var(--border-width-1) solid var(--color-border-default);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .announcements-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: var(--spacing-2) var(--spacing-6);
            border: var(--border-width-1) solid var(--color-border-default);
            border-radius: var(--radius-pill);
            background: var(--color-background-surface);
            color: var(--color-text-secondary);
            font-family: var(--font-family-heading);
            font-weight: var(--font-weight-bold);
            white-space: nowrap;
            cursor: pointer;
            transition: all var(--motion-duration-default) var(--motion-easing-standard);
        }

        .tab-btn:hover {
            border-color: var(--color-brand-primary);
            color: var(--color-brand-primary);
        }

        .tab-btn.active {
            background: var(--color-brand-primary);
            color: var(--color-white);
            border-color: var(--color-brand-primary);
            box-shadow: var(--shadow-focus-primary);
        }

        /* --- Tarjetas de Anuncios --- */
        .announcements-list {
            display: grid;
            gap: var(--spacing-lg);
        }

        .announcement-card {
            position: relative;
            padding: var(--spacing-xl);
            background: var(--color-background-surface);
            border: var(--border-width-1) solid var(--color-border-default);
            border-radius: var(--radius-xl);
            transition: all var(--motion-duration-default) var(--motion-easing-standard);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .announcement-card:hover {
            transform: translateY(-4px);
            border-color: var(--color-brand-primary);
            box-shadow: var(--shadow-ambient);
        }

        .announcement-card.priority {
            border-left: var(--border-width-6) solid var(--color-brand-secondary);
            background: var(--color-background-surface-low);
        }

        .announcement-card.unread::before {
            content: '';
            position: absolute;
            top: var(--spacing-4);
            right: var(--spacing-4);
            width: 12px;
            height: 12px;
            background: var(--color-brand-primary);
            border-radius: var(--radius-pill);
            box-shadow: 0 0 8px var(--color-brand-primary);
        }

        .announcement-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: var(--font-size-xs);
        }

        .announcement-tag {
            padding: var(--spacing-1) var(--spacing-3);
            border-radius: var(--radius-pill);
            background: var(--color-background-surface-medium);
            color: var(--color-brand-primary);
            font-weight: var(--font-weight-extrabold);
            text-transform: uppercase;
            letter-spacing: var(--letter-spacing-wide);
        }

        .announcement-date {
            color: var(--color-text-muted);
        }

        .announcement-content h3 {
            margin: 0 0 var(--spacing-2);
            color: var(--color-text-display);
            font-family: var(--font-family-heading);
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-extrabold);
        }

        .announcement-content p {
            margin: 0;
            color: var(--color-text-secondary);
            font-size: var(--font-size-base);
        }

        .announcement-footer {
            margin-top: var(--spacing-2);
            display: flex;
            justify-content: flex-end;
        }

        .btn-read-more {
            padding: var(--spacing-2) var(--spacing-4);
            border-radius: var(--radius-pill);
            background: var(--color-background-surface-low);
            color: var(--color-brand-primary);
            font-family: var(--font-family-heading);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            text-decoration: none;
            border: var(--border-width-1) solid var(--color-border-default);
            transition: all var(--motion-duration-default) var(--motion-easing-standard);
        }

        .btn-read-more:hover {
            background: var(--color-brand-primary);
            color: var(--color-white);
            border-color: var(--color-brand-primary);
        }

        @media (max-width: 768px) {
            .announcements-shell {
                padding: var(--spacing-xl);
            }
            .announcements-title {
                font-size: var(--font-size-3xl);
            }
        }

        @media (max-width: 520px) {
            .announcements-wrapper {
                padding: 0 var(--spacing-sm);
            }
            .announcements-shell {
                padding: var(--spacing-md);
                border-radius: var(--radius-lg);
            }
        }
    </style>
</head>

<body>
    <nav class="top-nav" aria-label="Navegación superior de anuncios">
        <div class="nav-left">
            <button class="menu-btn" type="button" onclick="toggleSidebar()" aria-label="Abrir menú de navegación"
                aria-expanded="false" aria-controls="sidebar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="logo-container">
                <img data-assets="LLM_Docencia_4.0_logo.png" src="assets/LLM_Docencia_4.0_logo.png"
                    alt="Logo Docencia 4.0">
            </div>
            <span class="module-title-nav">Anuncios</span>
        </div>
    </nav>

    <div class="module-sidebar-overlay" id="overlay" onclick="closeSidebar()" aria-hidden="true"></div>

    <aside class="module-sidebar" id="sidebar" aria-label="Menú de navegación" aria-hidden="true">
        <h2 class="side-menu-title">LMS Menú</h2>
        <ul class="menu-links">
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="anuncios.html" class="active" aria-current="page">📢 Anuncios</a></li>
            <li><a href="perfil.html">👤 Mi Perfil</a></li>
            <li><span class="menu-section-label">Foros</span></li>
            <li><a href="foro_general.html">💬 Foro General</a></li>
            <li><span class="menu-section-label">Módulos</span></li>
            <li><a href="modulo1_intro.html">📘 Módulo 1</a></li>
            <li><a href="modulo2_intro.html">📗 Módulo 2</a></li>
            <li><a href="modulo3_intro.html">📙 Módulo 3</a></li>
        </ul>
    </aside>

    <main class="announcements-wrapper">
        <article class="announcements-shell" aria-labelledby="announcements-title">
            <header class="announcements-header">
                <h1 id="announcements-title" class="announcements-title">Anuncios del <span>Programa</span></h1>
                <p>Mantente informado sobre las últimas novedades, cambios en el calendario y recursos nuevos.</p>
            </header>

            <nav class="announcements-tabs" role="tablist" aria-label="Filtros de anuncios">
                <button class="tab-btn active" role="tab" aria-selected="true" onclick="filterAnnouncements('all')">Todos</button>
                <button class="tab-btn" role="tab" aria-selected="false" onclick="filterAnnouncements('priority')">Prioritarios</button>
                <button class="tab-btn" role="tab" aria-selected="false" onclick="filterAnnouncements('modulo-1')">Módulo 1</button>
                <button class="tab-btn" role="tab" aria-selected="false" onclick="filterAnnouncements('modulo-2')">Módulo 2</button>
                <button class="tab-btn" role="tab" aria-selected="false" onclick="filterAnnouncements('modulo-3')">Módulo 3</button>
            </nav>

            <section class="announcements-list" id="announcementsList">
                <p class="loading-text">Cargando anuncios...</p>
            </section>
        </article>
    </main>

    <a href="#" class="btn-scroll-top" id="scrollTopBtn" aria-label="Subir al inicio">↑</a>

    <!-- Firebase y Lógica de Negocio -->
    <script src="scripts/auth-guard.js" type="module"></script>
    <script src="scripts/announcements-handler.js" type="module"></script>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.querySelector('.menu-btn');
        const scrollTopBtn = document.getElementById('scrollTopBtn');

        function openSidebar() {
            sidebar?.classList.add('active');
            overlay?.classList.add('active');
            menuBtn?.setAttribute('aria-expanded', 'true');
        }

        function closeSidebar() {
            sidebar?.classList.remove('active');
            overlay?.classList.remove('active');
            menuBtn?.setAttribute('aria-expanded', 'false');
        }

        function toggleSidebar() {
            sidebar?.classList.contains('active') ? closeSidebar() : openSidebar();
        }

        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollTopBtn?.classList.add('visible');
            } else {
                scrollTopBtn?.classList.remove('visible');
            }
        });

        scrollTopBtn?.addEventListener('click', (e) => {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function resolveAssetPath(img) {
            const rawAssets = img.dataset.assets || img.dataset.asset;
            if (!rawAssets) return;
            const fileNames = rawAssets.split('|').map(item => item.trim());
            const bases = ['./assets/', 'assets/', '../assets/', '/assets/'];
            let index = 0;
            const tryNext = () => {
                if (index < bases.length) {
                    img.src = bases[index] + fileNames[0];
                    index++;
                }
            };
            img.onerror = tryNext;
            tryNext();
        }
        document.querySelectorAll('img[data-assets], img[data-asset]').forEach(resolveAssetPath);
    </script>
</body>
</html>
