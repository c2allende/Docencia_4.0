<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Copilot - Réplica Exacta</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --copilot-blue: #4447e5;
            --bg-main: #ffffff;
            --text-dark: #111111;
            --text-muted: #616161;
            --border-color: #e5e5e5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #customCursor {
            position: fixed;
            width: 32px;
            height: 32px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v10"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 9999;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .main-wrapper {
            display: grid;
            grid-template-rows: 1fr auto;
            height: 100vh;
            width: 100%;
            background: white;
            position: relative;
        }

        .content-area {
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scrollbar-width: thin;
        }

        .screen { width: 100%; max-width: 700px; display: flex; flex-direction: column; align-items: center; }
        .welcome-title { font-size: 2rem; font-weight: 700; margin-bottom: 30px; text-align: center; }

        .copilot-input-box {
            width: 100%;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .input-text-area { font-size: 1.1rem; min-height: 50px; line-height: 1.5; color: #111; white-space: pre-wrap; }
        .input-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f5f5f5; margin-top: 15px; padding-top: 15px; }

        .btn-send { width: 36px; height: 36px; background: var(--copilot-blue); border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; }

        /* Chat UI */
        .chat-screen { display: none; width: 100%; max-width: 750px; flex-direction: column; gap: 20px; }
        .user-bubble { align-self: flex-end; background: #f3f3f3; padding: 16px 20px; border-radius: 20px 20px 4px 20px; font-size: 1rem; max-width: 85%; color: #333; }
        
        .ai-response { display: flex; flex-direction: column; gap: 15px; padding-bottom: 40px; width: 100%; }
        .ai-header { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.1rem; color: var(--copilot-blue); }
        .ai-content { font-size: 1.05rem; line-height: 1.7; color: #333; white-space: pre-wrap; }

        /* Estilos de respuesta exactos de la imagen */
        .analogia-title { font-weight: 700; font-size: 1.1rem; display: block; margin-top: 15px; }
        .analogia-text { font-style: italic; color: #444; }
        .divider { border-bottom: 1px solid #eee; margin: 20px 0; }

        .ai-footer-icons { display: flex; gap: 15px; margin-top: 20px; color: #666; font-size: 0.9rem; }

        /* CAJA DE MENSAJE INFERIOR */
        .caption-box {
            background: #202124;
            color: #ffffff;
            padding: 18px 30px;
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: center;
            font-style: italic;
            border-top: 5px solid var(--copilot-blue);
            width: 100%;
        }

        .hidden { display: none !important; }
        .fade-out { opacity: 0; transition: opacity 0.4s ease; }

    </style>
</head>
<body>

    <div id="customCursor"></div>

    <div class="main-wrapper">
        <div class="content-area" id="scrollArea">
            
            <div class="screen" id="homeScreen">
                <h1 class="welcome-title">Hola, ¿en qué te puedo ayudar?</h1>
                <div class="copilot-input-box">
                    <div class="input-text-area" id="typingBox"></div>
                    <div class="input-footer">
                        <div style="color: #666;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
                        <div class="btn-send" id="btnSend">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-screen" id="chatScreen">
                <div class="user-bubble" id="userBubble"></div>
                <div class="ai-response">
                    <div class="ai-header">
                        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                            <path d="M16 0C7.16344 0 0 7.16344 0 16C0 24.8366 7.16344 32 16 32C24.8366 32 32 24.8366 32 16C32 7.16344 24.8366 0 16 0Z" fill="url(#p1)"/>
                            <path d="M16.5 7C11.25 7 7 11.25 7 16.5S11.25 26 16.5 26 26 21.75 26 16.5 21.75 7 16.5 7Z" fill="white"/>
                            <defs><linearGradient id="p1" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#4447E5"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs>
                        </svg>
                        Copilot
                    </div>
                    <div class="ai-content" id="aiContent"></div>
                    <div class="ai-footer-icons" id="aiIcons" style="opacity: 0;">
                        <span>👍</span> <span>👎</span> <span>📋 Copiar</span> <span>🔄 Regenerar</span>
                    </div>
                </div>
            </div>

        </div>

        <div class="caption-box">
            "En el dash board de copilot incluyo el prompt y se presiona enviar. Luego, el modelo entra en modo de generación y comienza a escribir la respuesta de forma progresiva. La respuesta se consolida en aproximadamente 4 a 5 segundos."
        </div>
    </div>

    <script>
        const cursor = document.getElementById('customCursor');
        const scrollArea = document.getElementById('scrollArea');
        const typingBox = document.getElementById('typingBox');
        const btnSend = document.getElementById('btnSend');
        const homeScreen = document.getElementById('homeScreen');
        const chatScreen = document.getElementById('chatScreen');
        const userBubble = document.getElementById('userBubble');
        const aiContent = document.getElementById('aiContent');
        const aiIcons = document.getElementById('aiIcons');

        const promptText = "Hola, soy maestro de Ciencias en Puerto Rico. ¿Cómo explico a mis alumnos de 12 años la importancia de llegar temprano sin sonar regañón? Dame 2 ideas.";
        
        // TEXTO EXACTO DE LA IMAGEN
        const responseText = "¡Excelente pregunta! Aquí tienes dos analogías divertidas que puedes usar:\n\n" +
            "1. La carrera espacial\n" +
            "\"Llegar temprano a clase es como ser parte de una misión espacial. Si el cohete despega y tú no estás a bordo, te pierdes el viaje más emocionante. La clase empieza con el 'despegue' y si llegas tarde, es como intentar subirte al cohete cuando ya está en el espacio... ¡imposible!\"\n\n" +
            "2. El cine con final sorpresa\n" +
            "\"Imagina que vamos a ver una película con un inicio espectacular y pistas para entender el final. Si llegas tarde, es como entrar cuando ya empezó la acción: te pierdes las pistas y luego todo parece confuso. Llegar a tiempo te asegura disfrutar la historia completa.\"\n\n" +
            "¿Quieres que te prepare **una lista con 5 analogías**?";

        async function startLoop() {
            while(true) {
                homeScreen.classList.remove('hidden', 'fade-out');
                chatScreen.style.display = 'none';
                typingBox.innerText = "";
                aiContent.innerText = "";
                aiIcons.style.opacity = '0';
                scrollArea.scrollTop = 0;
                cursor.style.opacity = '1';
                cursor.style.left = '50px'; cursor.style.top = '150px';

                await delay(1000);
                await typeWriter(promptText, typingBox, 30);
                
                const rect = btnSend.getBoundingClientRect();
                await moveCursor(rect.left + 18, rect.top + 18);
                await delay(300);
                
                homeScreen.classList.add('fade-out');
                await delay(500);
                homeScreen.classList.add('hidden');
                chatScreen.style.display = 'flex';
                userBubble.innerText = promptText;

                moveCursor(window.innerWidth - 100, 300);

                await typeWriter(responseText, aiContent, 20, true);
                aiIcons.style.opacity = '1';
                
                await delay(6000);
                cursor.style.opacity = '0';
                await delay(500);
            }
        }

        function typeWriter(text, el, speed, autoScroll = false) {
            return new Promise(r => {
                let i = 0; el.innerText = "";
                function t() {
                    if(i < text.length) { 
                        el.innerText += text[i++]; 
                        if(autoScroll) scrollArea.scrollTop = scrollArea.scrollHeight;
                        setTimeout(t, speed); 
                    }
                    else r();
                }
                t();
            });
        }

        function moveCursor(tx, ty) {
            return new Promise(r => {
                let sx = parseInt(cursor.style.left) || 0, sy = parseInt(cursor.style.top) || 0;
                let start = performance.now();
                function anim(t) {
                    let p = Math.min((t - start) / 800, 1);
                    let ease = p * (2 - p);
                    cursor.style.left = (sx + (tx - sx) * ease) + 'px';
                    cursor.style.top = (sy + (ty - sy) * ease) + 'px';
                    if(p < 1) requestAnimationFrame(anim); else r();
                }
                requestAnimationFrame(anim);
            });
        }

        function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
        window.onload = startLoop;
    </script>
</body>
</html>
